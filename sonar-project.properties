# Organisation SonarCloud
sonar.organization=patayencroute

# Key required for SonarQube / SonarCloud
sonar.projectKey=PatayEnCroute_Openview
sonar.projectName=Openview
sonar.projectVersion=0.1.0

# Source directories for analysis
sonar.sources=packages/core/src,packages/designer/src,packages/engine/src,packages/viewer/src,apps/playground/src

# Test files. Previously limited to packages/core/src, which meant tests in every
# other package were analysed as production code.
sonar.tests=packages/core/src,packages/designer/src,packages/engine/src,packages/viewer/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# sonar.sources and sonar.tests deliberately name the same directories, so the
# partition between them must be explicit: without this line a test file is
# reachable from both and the scanner aborts with "can't be indexed twice".
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Exclusions
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/dist/**,**/node_modules/**,apps/playground/**
# The twelve embedded font faces are generated data, not written code. Two faces
# of one family legitimately declare the same `cmap` ranges -- Inter Regular and
# Inter Bold really do cover the same 207 intervals -- so the scanner counted
# 1406 duplicated lines and put the new-code duplication at 37.9%. There is no
# duplication to remove: the ranges are a fact about the fonts, re-derived from
# the embedded bytes on every run by `fonts/__tests__/integrity.test.ts`.
#
# Narrow on purpose. It covers ONLY `fonts/generated/`, which no human edits and
# `tools/fonts/generate.mjs` rewrites whole. The two TrueType readers of this
# repository are deliberately duplicated and are NOT excluded: one checks the
# other, and the scanner is right to keep watching them.
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/dist/**,**/document/fonts/generated/**

# One report for the whole monorepo, written by the root vitest.config.ts.
#
# Per-package reports could not work here. Vitest writes `SF:` paths relative to the
# package it ran in, and Sonar resolves `SF` against sonar.projectBaseDir -- this
# directory -- so `SF:src/index.ts` sent it looking for <root>/src/index.ts, which
# does not exist: every file came back unresolved and coverage was recorded as 0%
# while the scan stayed green. core and engine also emitted the identical
# `SF:src/index.ts`, so even a suffix match was ambiguous between four packages.
# Two of the four paths listed here previously could not be produced at all,
# because designer and viewer had no test runner.
#
# The root run emits `SF:packages/core/src/index.ts`, which resolves, and covers
# every package including the ones with no tests yet (visible at 0% rather than
# absent). Adding a package needs no edit here.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Fail the workflow when the quality gate fails. Without this the scan only
# reports, and a merge can go through with the gate red.
sonar.qualitygate.wait=true

# Source encoding
sonar.sourceEncoding=UTF-8
