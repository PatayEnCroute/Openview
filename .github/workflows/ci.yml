name: Continuous Integration

on:
  push:
    branches: [main]
  # No branch filter on purpose: a pull request targeting a stacked branch
  # rather than main would otherwise get no CI at all, and silently so.
  pull_request:

# Least privilege. Nothing here writes to the repository, so the default token
# permissions (potentially write-all) are narrowed to read.
permissions:
  contents: read

# A newer push to the same ref makes the running job obsolete.
concurrency:
  group: ci-${{ github.ref }}
  # Superseded runs are cancelled, except on main: a cancelled status is not a
  # passing one, and branch protection reads it per-commit.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Actions are pinned to a full commit SHA, not a tag. A tag is mutable: whoever
# controls the action repository can repoint it at new code that would run with
# this workflow's token. Dependabot (see .github/dependabot.yml) keeps the pins
# current and rewrites the trailing version comment.
jobs:
  quality:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # These jobs run repository code on a pull_request trigger, and checkout
          # otherwise leaves the token in the local git config for it to read.
          # No job in this workflow pushes, so nothing needs the credential.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Cheapest gate in the pipeline, and the only one that enforces the
      # AGENTS.md rules the compiler cannot express. Runs once, not per matrix leg.
      - name: Lint & Format Check
        run: pnpm run lint

  build-and-test:
    name: Build, Type Check & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24: active LTS (Krypton), and the floor declared by @openview/engine.
        # 26: current release, so forward-compatibility breaks surface here first.
        node: [24, 26]

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Must precede setup-node: resolving the pnpm cache shells out to
      # `pnpm store path`, which needs pnpm already on PATH. Getting this order
      # wrong is what broke caching in 85a9d7b, where it was removed instead.
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Monorepo
        run: pnpm run build

      - name: Type Check
        run: pnpm run type-check

      - name: Run Unit Tests with Coverage
        run: pnpm run test:coverage

  # E6: the same document, on two machines. The matrix above proves the code runs
  # under two Node majors; it deliberately does NOT compare their output, because
  # two Node builds may carry two ICU versions and ADR 0008 forbids comparing
  # strings across them. These two legs are pinned to one exact runner and one
  # exact Node patch so that their bytes ARE comparable, and the third job says so.
  reproducibility:
    name: Reproducible Render (${{ matrix.leg }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Two independent machines running the identical recipe. Same OS image and
        # same Node patch: `24` alone would let a patch bump change V8 or ICU under
        # one leg and not the other, which is exactly the drift this job exists to
        # catch rather than to suffer.
        leg: [first, second]

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.1
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Monorepo
        run: pnpm run build

      # `--no-sandbox` is the one launch argument this runner needs, and it travels
      # in the profile: both legs must carry exactly the same list or the comparison
      # is refused before a single digest is read.
      - name: Render Ten Times
        run: node tools/reproducibility/render.mjs manifest-${{ matrix.leg }}.json --no-sandbox

      # Profile, byte lengths and digests only. No pdf and no data set is ever
      # published: the artefact is the attestation, not the document.
      - name: Publish Manifest
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: reproducibility-${{ matrix.leg }}
          path: manifest-${{ matrix.leg }}.json
          retention-days: 7
          if-no-files-found: error

  compare-machines:
    name: Same Bytes On Both Machines
    runs-on: ubuntu-24.04
    needs: reproducibility

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.1

      - name: Download Manifests
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: reproducibility-*
          merge-multiple: true

      # Refuses two different profiles first, and only then compares the twenty
      # digests. No dependency is installed here: the comparator reads two JSON
      # files and nothing else.
      - name: Compare Both Machines
        run: node tools/reproducibility/compare.mjs manifest-first.json manifest-second.json
