name: SonarQube Cloud Scan

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  # Superseded runs are cancelled, except on main: a cancelled status is not a
  # passing one, and branch protection reads it per-commit.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  sonar-scan:
    name: Sonar Analysis
    runs-on: ubuntu-latest
    # A pull request opened from a fork cannot read SONAR_TOKEN, so the scan would
    # fail for reasons no external contributor can fix. Skip it there; the CI and
    # security workflows still gate the change.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sonar needs full history to attribute issues to authors and to
          # compute new-code periods.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # No explicit build step: Sonar analyses sources plus the LCOV report, never
      # dist/, and the `test:coverage` task already pulls in `^build` for whatever
      # a test actually needs. Building the whole monorepo here was dead work.
      - name: Generate Test Coverage (LCOV)
        run: pnpm run test:coverage

      # Replaces the deprecated SonarSource/sonarcloud-github-action, which is a
      # drop-in predecessor of this action.
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
