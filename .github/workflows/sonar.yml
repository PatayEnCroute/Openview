name: SonarQube Cloud Scan

on:
  push:
    branches: [main]
  # No branch filter on purpose: a pull request targeting a stacked branch
  # rather than main would otherwise get no CI at all, and silently so.
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  # Superseded runs are cancelled, except on main: a cancelled status is not a
  # passing one, and branch protection reads it per-commit.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  sonar-scan:
    name: Sonar Analysis
    runs-on: ubuntu-latest
    # Two kinds of pull request run cannot read SONAR_TOKEN, and the scan then dies
    # on an authentication error nobody can fix from the pull request itself:
    #
    #   - a fork, whose runs never see this repository's secrets;
    #   - anything Dependabot triggers. Its branches live in this repository, so
    #     the fork test below answers yes, yet GitHub routes those runs to the
    #     separate Dependabot secret store: SONAR_TOKEN comes back empty and the
    #     scanner talks to SonarCloud anonymously ("Not authorized or project not
    #     found", exit code 3).
    #
    # Skipping the second case leaves no hole. A bump touches package.json and
    # pnpm-lock.yaml, neither of which is in sonar.sources, so there is no new code
    # to measure; CI still builds, type-checks and tests it, and the push analysis
    # on main runs once it merges. `github.actor` is the exact condition -- a human
    # pushing a commit onto a Dependabot branch does get the secret, so that run
    # does get scanned.
    # (Every line of this folded scalar stays at one indentation level: a deeper
    # line would keep its newline instead of being joined by a space.)
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sonar needs full history to attribute issues to authors and to
          # compute new-code periods.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # No explicit build step: Sonar analyses sources plus the LCOV report, never
      # dist/, and the `test:coverage` script runs `turbo run build` itself for
      # whatever a test resolves through a sibling's `exports`. Building the whole
      # monorepo again here was dead work.
      #
      # Writes one report at coverage/lcov.info -- the single path
      # sonar-project.properties reads. Per-package reports were unresolvable: see
      # the comment there.
      - name: Generate Test Coverage (LCOV)
        run: pnpm run test:coverage

      # Replaces the deprecated SonarSource/sonarcloud-github-action, which is a
      # drop-in predecessor of this action.
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
